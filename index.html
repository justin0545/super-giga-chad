<body>
<div class="wrap">
  <header>
    <div>
      <h1>GIGA CHAD CHRONICLES</h1>
    </div>
    <div class="meta">
      <button class="toggle" id="musicBtn" aria-pressed="true">MUSIC: ON</button>
      <div class="best">BEST <b id="best">000000</b></div>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" width="400" height="240" tabindex="0" aria-label="Giga Chad Chronicles game screen. Press Enter to start."></canvas>
  </div>

  <div class="keys" aria-label="Keyboard controls">
    <span><kbd>←</kbd><kbd>→</kbd> move</span>
    <span><kbd>Space</kbd> / <kbd>↑</kbd> jump (hold for higher)</span>
    <span><kbd>Shift</kbd> run</span>
    <span><kbd>↓</kbd> / <kbd>S</kbd> open a trapdoor</span>
    <span><kbd>E</kbd> use stored power-up</span>
    <span><kbd>Shift</kbd> / <kbd>C</kbd> throw plates (tren) or punch (speedo)</span>
    <span><kbd>Enter</kbd> start</span>
    <span><kbd>P</kbd> / <kbd>Esc</kbd> pause menu</span>
    <span><kbd>M</kbd> music on/off</span>
    <span>Gamepad: <kbd>A</kbd> jump, <kbd>B</kbd>/<kbd>X</kbd> run &amp; throw, <kbd>Y</kbd> item, <kbd>Start</kbd> pause</span>
  </div>

  <div class="pad" aria-label="Touch controls">
    <div class="grp dir">
      <button data-k="left" aria-label="Move left">◀</button>
      <button data-k="right" aria-label="Move right">▶</button>
      <button data-k="down" aria-label="Open trapdoor">▼</button>
    </div>
    <div class="mid">
      <button class="small" data-k="start">START</button>
      <button class="small" data-k="item" aria-label="Use stored power-up">ITEM</button>
    </div>
    <div class="grp">
      <button data-k="run" aria-label="Run, throw plates on tren, or punch in the speedo">RUN</button>
      <button data-k="jump" class="jump">JUMP</button>
    </div>
  </div>
</div>
