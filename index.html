<!doctype html>
<html lang="en">

<meta charset="utf-8">

<style>
/* base reset matching the artifact host */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Super Giga Chad</title>

<style>
/* Layout: one arcade cabinet column — marquee header, the screen, then the control legend (keycaps on desktop, a touch pad on phones). Single dusk-arcade look in both themes. */
:root {
  color-scheme: dark;
  --bg: #14101f;
  --panel: #1f1830;
  --ink: #f3ecff;
  --muted: #a99cc4;
  --gold: #ffc93c;
  --line: #3a2f55;
  --shadow: #6a2a8a;
  --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --body: "Chakra Petch", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); }

.best { font-family: var(--pixel); font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.toggle {
  font-family: var(--pixel); font-size: 9px; color: var(--ink); background: var(--panel); cursor: pointer;

<body>
<div class="wrap">
  <header>
    <div>
      <h1>SUPER GIGA CHAD</h1>
      <p class="tag">World 1-1: Leg Day. Start skinny, drink the protein shake to get jacked, stomp the soyjaks, reach the gym.</p>
    </div>
    <div class="meta">
      <button class="toggle" id="musicBtn" aria-pressed="true">MUSIC: ON</button>
      <div class="best">BEST <b id="best">000000</b></div>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" width="400" height="240" tabindex="0" aria-label="Super Giga Chad game screen. Press Enter to start."></canvas>
  </div>

  <div class="keys" aria-label="Keyboard controls">
    <span><kbd>←</kbd><kbd>→</kbd> move</span>
    <span><kbd>Space</kbd> / <kbd>↑</kbd> jump (hold for higher)</span>
    <span><kbd>Shift</kbd> run</span>
    <span><kbd>Enter</kbd> start</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> music on/off</span>
  </div>

  <div class="pad" aria-label="Touch controls">
    <div class="grp">
      <button data-k="left" aria-label="Move left">◀</button>
      <button data-k="right" aria-label="Move right">▶</button>
    </div>
    <button class="small" data-k="start">START</button>
    <div class="grp">
      <button data-k="run">RUN</button>
      <button data-k="jump" class="jump">JUMP</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 400, H = 240, TS = 16, ROWS = 15, COLS = 212;
const FLAG_COL = 198, GYM_COL = 203, DOOR_X = GYM_COL * TS + 50;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FONT = '"Press Start 2P", ui-monospace, monospace';

/* ---------- storage ---------- */
let best = 0;
function loadBest() { try { best = parseInt(localStorage.getItem('gigachad-best') || '0', 10) || 0; } catch (e) {} }
function saveBest() { try { localStorage.setItem('gigachad-best', String(best)); } catch (e) {} }
const bestEl = document.getElementById('best');
const pad6 = n => String(Math.max(0, n | 0)).padStart(6, '0');
function showBest() { bestEl.textContent = pad6(best); }

/* ---------- audio ---------- */
let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = null, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const seq = (notes, step, dur, type = 'square', vol = 0.05) => notes.forEach((f, i) => tone(f, dur, type, vol, null, i * step));
const sfx = {
  jump: () => tone(300, 0.18, 'square', 0.05, 640),
  coin: () => { tone(988, 0.07, 'square', 0.05); tone(1319, 0.28, 'square', 0.05, null, 0.07); },
  stomp: () => tone(220, 0.12, 'square', 0.07, 70),
  bump: () => tone(130, 0.08, 'triangle', 0.12),
  brick: () => tone(110, 0.22, 'sawtooth', 0.07, 40),
  item: () => tone(280, 0.35, 'triangle', 0.09, 620),
  power: () => seq([523, 659, 784, 1047, 1319, 1568], 0.06, 0.1),
  hurt: () => tone(480, 0.35, 'square', 0.06, 110),
  die: () => seq([494, 466, 440, 392, 330, 262, 196], 0.13, 0.16),
  win: () => seq([392, 523, 659, 784, 1047, 1319, 1568, 1319, 1568], 0.12, 0.17),
  tick: () => tone(1760, 0.03, 'square', 0.025),
  oneup: () => seq([659, 784, 1319, 1047, 1175, 1568], 0.08, 0.1),
};

/* ---------- music: 8-bar loop at 150 BPM, 16th-note steps ---------- */
const STEP = 60 / 150 / 4;
const mid = m => 440 * Math.pow(2, (m - 69) / 12);
const BAR_C = [76, 0, 79, 0, 84, 0, 79, 76, 0, 79, 0, 81, 79, 0, 76, 0];
const BAR_AM = [76, 0, 72, 0, 69, 0, 72, 76, 0, 81, 0, 79, 76, 0, 72, 0];
const BAR_F = [77, 0, 81, 0, 84, 0, 81, 77, 0, 84, 0, 86, 84, 0, 81, 0];
const BAR_G = [79, 0, 83, 0, 86, 0, 83, 79, 0, 77, 76, 74, 71, 0, 74, 0];
const BAR_END = [79, 0, 79, 81, 83, 0, 86, 0, 84, 0, 0, 0, 79, 0, 0, 0];
const LEAD = [...BAR_C, ...BAR_AM, ...BAR_F, ...BAR_G, ...BAR_C, ...BAR_AM, ...BAR_F, ...BAR_END];
const ROOTS = [48, 45, 41, 43, 48, 45, 41, 43];
const music = { on: true, playing: false, step: 0, next: 0, timer: 0, bus: null };
let noiseBuf = null;
function noise() {
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.3), actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
function voice(freq, t, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.setValueAtTime(vol, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(music.bus);
  o.start(t); o.stop(t + dur + 0.02);
  return o;
}
function hit(t, dur, vol, cutoff) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noise(); f.type = 'highpass'; f.frequency.value = cutoff;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(music.bus);
  s.start(t); s.stop(t + dur + 0.02);
}
function scheduleStep(i, t) {
  const s = i % 16, root = ROOTS[i >> 4];
  if (LEAD[i]) voice(mid(LEAD[i]), t, STEP * 1.6, 'square', 0.035);
  if (s % 2 === 0) voice(mid(root + (s % 4 ? 12 : 0)), t, STEP * 1.8, 'triangle', 0.1);
  if (s === 15) voice(mid(root + 7), t, STEP * 0.9, 'triangle', 0.1);
  if (s === 0 || s === 8 || s === 10) voice(150, t, 0.12, 'sine', 0.2).frequency.exponentialRampToValueAtTime(40, t + 0.12);
  if (s === 4 || s === 12) hit(t, 0.12, 0.06, 1200);
  if (s % 2 === 1) hit(t, 0.03, 0.02, 7000);
}
function musicTick() {
  while (music.next < actx.currentTime + 0.12) {
    scheduleStep(music.step, music.next);
    music.next += STEP;
    music.step = (music.step + 1) % LEAD.length;
  }
}
function startMusic() {
  music.bus = actx.createGain();
  music.bus.gain.value = 0.6;
  music.bus.connect(actx.destination);
  music.playing = true;
  music.next = actx.currentTime + 0.06;
  musicTick();
  music.timer = setInterval(musicTick, 25);
}
function stopMusic() {
  if (!music.playing) return;
  music.playing = false;
  clearInterval(music.timer);
  const b = music.bus, t = actx.currentTime;
  b.gain.setValueAtTime(b.gain.value, t);
  b.gain.linearRampToValueAtTime(0, t + 0.08);
  setTimeout(() => b.disconnect(), 400);
}
function syncMusic() {
  const want = music.on && actx && actx.state === 'running' && state === 'play' && !paused && !document.hidden;
  if (want && !music.playing) startMusic();
  else if (!want && music.playing) stopMusic();
}
const musicBtn = document.getElementById('musicBtn');
function setMusic(on, save = true) {
  music.on = on;
  musicBtn.textContent = on ? 'MUSIC: ON' : 'MUSIC: OFF';
  musicBtn.setAttribute('aria-pressed', String(on));
  if (save) { try { localStorage.setItem('gigachad-music', on ? '1' : '0'); } catch (e) {} }
}
musicBtn.addEventListener('click', () => { initAudio(); setMusic(!music.on); canvas.focus(); });

/* ---------- sprites ---------- */
function makeSprite(rows, pal, w = 16) {
  const h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    row = row.padEnd(w, '.').slice(0, w);
    [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } });
  });
  const f = document.createElement('canvas'); f.width = w; f.height = h;
  const fg = f.getContext('2d'); fg.translate(w, 0); fg.scale(-1, 1); fg.drawImage(c, 0, 0);
  return { r: c, l: f };
}
const CHAD_PAL = {
  k: '#1b1411', h: '#24170f', H: '#4a3426', s: '#e0a77e', d: '#a8704b',
  b: '#3b2a20', w: '#ffffff', p: '#20223f', r: '#ffc93c', o: '#5a3a22', t: '#ece6f4', T: '#b9b0cc',
};
const CHAD_HEAD = [
  '....hhhhhhh.....',
  '...hhHHHHhhh....',
  '..hhhhhhhhhhh...',
  '..hhhhsssssss...',
  '..hhsssssskks...',
  '..hhssssswkss...',
  '..hdsssssssssd..',
  '..hdssssssssss..',
  '...dssssssbbb...',
  '...dbbssbbbbbb..',
  '...dbbbbbbbbbb..',
  '....dbbbbbbbb...',
];
// Skinny Chad: 16x28, baggy tee and stick limbs. Same hitbox as jacked Chad, only the art changes.
const SKINNY_BODY = [
  '......sss.......',
  '....tttttttt....',
  '...tttttttttt...',
  '...s.tttttt.s...',
  '...s.tttttt.s...',
  '...s.tTtttt.s...',
  '...s.tttttt.s...',
  '...s.tttttt.s...',
  '...d.pppppp.d...',
  '.....pp..pp.....',
];
const SKINNY_LEGS = {
  stand: ['.....s....s.....', '.....s....s.....', '.....s....s.....', '.....d....d.....', '....oo...oo.....', '....oo....oo....'],
  walk1: ['....s......s....', '....s......s....', '...s........s...', '...d........d...', '..oo........oo..', '..oo.........oo.'],
  walk2: ['......s..s......', '......s..s......', '......s..s......', '......d..d......', '.....oo..oo.....', '.....oo...oo....'],
  jump: ['....s.....s.....', '...s.......s....', '..s........s....', '..d.........d...', '.oo.........oo..', '.............o..'],
};
// Jacked Chad: 20x30, drawn centred on the same hitbox so he looks bigger without changing collisions.
const JACKED_BODY = [
  '.......dssssd.......',
  '...dssssssssssssd...',
  '.ssssssssssssssssss.',
  'ssssssdsssssdsssssss',
  'sssssssddddddsssssss',
  'ssss.ssssssssss.ssss',
  'sss..sssdsdssss..sss',
  'sss..ssssssssss..sss',
  'sss..sssdsdssss..sss',
  'ddd..ssssssssss..ddd',
  'sss..pppppppppp..sss',
  '.....ppprpppppp.....',
];
const JACKED_LEGS = {
  stand: ['.....sss....sss.....', '.....sss....sss.....', '.....sss....sss.....', '.....ddd....ddd.....', '....oooo....oooo....', '....oooo....ooooo...'],
  walk1: ['....sss......sss....', '....sss......sss....', '...sss........sss...', '...ddd........ddd...', '..oooo........oooo..', '..oooo.........oooo.'],
  walk2: ['......sss..sss......', '......sss..sss......', '......sss..sss......', '......ddd..ddd......', '.....oooo..oooo.....', '.....oooo..ooooo....'],
  jump: ['....sss.....sss.....', '...sss.......sss....', '..sss........sss....', '..ddd.........ddd...', '.oooo.........oooo..', '..............ooo...'],
};
const chad = { small: {}, big: {} };
const JACKED_HEAD = CHAD_HEAD.map(r => '..' + r);
for (const k in SKINNY_LEGS) chad.small[k] = makeSprite(CHAD_HEAD.concat(SKINNY_BODY, SKINNY_LEGS[k]), CHAD_PAL);
for (const k in JACKED_LEGS) chad.big[k] = makeSprite(JACKED_HEAD.concat(JACKED_BODY, JACKED_LEGS[k]), CHAD_PAL, 20);

const SOY_PAL = { k: '#2a2030', f: '#f0d0b8', g: '#2a2a2a', e: '#cfe8ff', m: '#6a1f2a', y: '#9a7650', c: '#6aa0c8' };
const SOY_TOP = [
  '....kkkkkkkk....',
  '...kffffffffk...',
  '..kffffffffffk..',
  '..kfggggfggggk..',
  '..kfgeegfgeegk..',
  '..kfggggfggggk..',
  '..kffffffffffk..',

  '..kyyfmmmmfyyk..',
  '...kyyyyyyyyk...',
  '....kcccccck....',
  '...kcccccccck...',
  '...kkkkkkkkkk...',
];
const soy = [
  makeSprite(SOY_TOP.concat(['...kk......kk...', '..kkk......kkk..']), SOY_PAL),
  makeSprite(SOY_TOP.concat(['....kk....kk....', '...kkk....kkk...']), SOY_PAL),
];

/* ---------- tiles ---------- */
function mk(fn) { const c = document.createElement('canvas'); c.width = c.height = 16; fn(c.getContext('2d')); return c; }
const R = (g, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
const tiles = {};
tiles['#'] = mk(g => {
  R(g, 0, 0, 16, 16, '#c4692f'); R(g, 0, 0, 16, 1, '#f0a060'); R(g, 0, 0, 1, 16, '#e08850');
  R(g, 0, 15, 16, 1, '#6b3015'); R(g, 15, 0, 1, 16, '#6b3015');
  R(g, 7, 1, 1, 7, '#8a4520'); R(g, 1, 8, 14, 1, '#8a4520'); R(g, 4, 9, 1, 6, '#8a4520'); R(g, 11, 9, 1, 6, '#8a4520');
});
tiles.B = mk(g => {
  R(g, 0, 0, 16, 16, '#b5512a'); R(g, 0, 0, 16, 1, '#e88a5a');
  const m = '#40180a';
  R(g, 0, 7, 16, 1, m); R(g, 0, 15, 16, 1, m); R(g, 7, 0, 1, 7, m); R(g, 3, 8, 1, 7, m); R(g, 11, 8, 1, 7, m);
});
const QMARK = ['..XXXX..', '.XX..XX.', '.....XX.', '....XX..', '...XX...', '........', '...XX...'];
tiles.q = ['#f8c040', '#e8a020', '#c88010'].map(base => mk(g => {
  R(g, 0, 0, 16, 16, '#5a3008'); R(g, 1, 1, 14, 14, base); R(g, 1, 1, 14, 1, '#ffe090');
  [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([x, y]) => R(g, x, y, 1, 1, '#5a3008'));
  QMARK.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === 'X') { R(g, 4 + x + 1, 4 + y + 1, 1, 1, '#5a3008'); R(g, 4 + x, 4 + y, 1, 1, '#fff4d0'); }
  }));
}));
tiles.U = mk(g => {
  R(g, 0, 0, 16, 16, '#3a2008'); R(g, 1, 1, 14, 14, '#9a6a3a');
  [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([x, y]) => R(g, x, y, 1, 1, '#3a2008'));
});
tiles.X = mk(g => {
  R(g, 0, 0, 16, 16, '#5a2a10'); R(g, 0, 0, 15, 15, '#e0a070'); R(g, 1, 1, 14, 14, '#b06a3a');
  R(g, 4, 4, 8, 8, '#9a5a2e'); R(g, 4, 4, 8, 1, '#7a4220'); R(g, 4, 4, 1, 8, '#7a4220');
});
const PO = '#0a2a10', PB = '#3cb04a', PL = '#9ae67a', PD = '#1a6a2a';
tiles['['] = mk(g => { R(g, 0, 0, 16, 16, PO); R(g, 1, 1, 15, 14, PB); R(g, 3, 1, 3, 14, PL); });
tiles[']'] = mk(g => { R(g, 0, 0, 16, 16, PO); R(g, 0, 1, 15, 14, PB); R(g, 10, 1, 3, 14, PD); });
tiles['{'] = mk(g => { R(g, 2, 0, 14, 16, PO); R(g, 3, 0, 13, 16, PB); R(g, 5, 0, 3, 16, PL); });
tiles['}'] = mk(g => { R(g, 0, 0, 14, 16, PO); R(g, 0, 0, 13, 16, PB); R(g, 8, 0, 3, 16, PD); });

const SOLID = new Set(['#', 'B', '?', 'P', 'U', 'X', '[', ']', '{', '}']);

/* ---------- level ---------- */
let map = [];
let enemySpawns = [];
function buildLevel() {
  const m = Array.from({ length: ROWS }, () => Array(COLS).fill('.'));
  const set = (x, y, c) => { if (x >= 0 && x < COLS && y >= 0 && y < ROWS) m[y][x] = c; };
  const ground = (a, b) => { for (let x = a; x <= b; x++) { set(x, 13, '#'); set(x, 14, '#'); } };
  const row = (x, y, s) => [...s].forEach((c, i) => { if (c !== ' ') set(x + i, y, c); });

/* ---------- update ---------- */

function drawPlayer() {
  const p = player;

  else if (!p.onGround && state !== 'win') fr = set.jump;
  else if (state === 'win' && win.phase === 'slide') fr = set.jump;
  else if (Math.abs(p.vx) > 0.15) fr = Math.floor(p.anim) % 2 ? set.walk2 : set.walk1;
  else fr = set.stand;
  const img = p.facing < 0 ? fr.l : fr.r;
  ctx.save();
  if (big) { ctx.shadowColor = '#ffd23a'; ctx.shadowBlur = 8; }
  ctx.drawImage(img, Math.round(p.x + p.w / 2 - img.width / 2), Math.round(p.y + p.h - img.height));
  ctx.restore();
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.active) continue;
    const spr = soy[Math.floor(e.anim / 10) % 2];
    const img = e.dir > 0 ? spr.l : spr.r;
    const x = Math.round(e.x - 1), y = Math.round(e.y);
    if (e.dead === 'squash') ctx.drawImage(img, x, y + 10, 16, 6);
    else if (e.dead === 'flip') { ctx.save(); ctx.translate(x, y + 16); ctx.scale(1, -1); ctx.drawImage(img, 0, 0); ctx.restore(); }
    else ctx.drawImage(img, x, y);
  }
}

function drawShake(x, y) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = '#1a0f2e'; ctx.fillRect(x + 1, y + 3, 12, 13); ctx.fillRect(x + 3, y, 8, 4);
  ctx.fillStyle = '#f3f3f3'; ctx.fillRect(x + 4, y + 1, 6, 3);
  ctx.fillStyle = '#7b3fe4'; ctx.fillRect(x + 2, y + 4, 10, 11);
  ctx.fillStyle = '#a77bff'; ctx.fillRect(x + 3, y + 5, 2, 9);
  ctx.fillStyle = '#ffc93c'; ctx.fillRect(x + 6, y + 8, 5, 4);
}

function drawFx() {
  for (const f of fx) {
    if (f.kind === 'coin') drawCoin(f.x - 4, f.y, frame * 2);
    else if (f.kind === 'debris') { ctx.fillStyle = '#b5512a'; ctx.fillRect(Math.round(f.x), Math.round(f.y), 6, 6); ctx.fillStyle = '#40180a'; ctx.fillRect(Math.round(f.x) + 2, Math.round(f.y) + 2, 2, 2); }
    else if (f.kind === 'spark') { ctx.fillStyle = f.t > 9 ? '#fff4b0' : '#ffc93c'; ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, 1); }
    else if (f.kind === 'text') text(f.s, Math.round(f.x), Math.round(f.y), '#ffffff', 'left', 8);
  }
}

function text(s, x, y, col = '#fff', align = 'left', size = 8) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function drawHud() {
  const cols = [[12, 'CHAD', pad6(score)], [96, 'COINS', 'x' + String(coins).padStart(2, '0')], [180, 'LIVES', 'x' + lives], [256, 'WORLD', ' 1-1'], [336, 'TIME', state === 'title' ? '' : String(time).padStart(3, '0')]];
  for (const [x, a, b] of cols) { text(a, x, 8); text(b, x, 19); }
}

function drawWorld() {
  drawBackground();
  ctx.save();
  ctx.translate(-Math.round(camX), 0);
  drawFlagAndGym();
  for (const it of items) drawShake(it.x, it.y);
  drawTiles();
  drawEnemies();
  drawPlayer();
  drawFx();
  ctx.restore();
}

function panel(y, h) { ctx.fillStyle = 'rgba(16, 10, 28, 0.78)'; ctx.fillRect(0, y, W, h); }
const blink = () => Math.floor(frame / 30) % 2 === 0;
const touch = matchMedia('(pointer: coarse)').matches;

function draw() {
  ctx.imageSmoothingEnabled = false;
  if (state === 'intro' || state === 'gameover') {
    ctx.fillStyle = '#0c0814'; ctx.fillRect(0, 0, W, H);
    drawHud();
    if (state === 'intro') {
      text('WORLD 1-1', W / 2, 78, '#fff', 'center', 8);
      text('LEG DAY', W / 2, 94, '#ffc93c', 'center', 8);
      ctx.drawImage(chad.small.stand.r, W / 2 - 34, 118);
      text('x  ' + lives, W / 2 - 6, 132, '#fff', 'left', 8);
    } else {
      text('GAME OVER', W / 2, 92, '#fff', 'center', 16);
      text('THE GAINS WILL RETURN', W / 2, 124, '#a99cc4', 'center', 8);
      if (stateT <= 0 && blink()) text(touch ? 'TAP JUMP TO RETRY' : 'PRESS ENTER TO RETRY', W / 2, 160, '#ffc93c', 'center', 8);
    }
    return;
  }
  drawWorld();
  drawHud();
  if (state === 'title') {
    panel(40, 176);
    text('SUPER', W / 2, 52, '#fff', 'center', 8);
    text('GIGA CHAD', W / 2, 66, '#ffc93c', 'center', 24);
    ctx.save(); ctx.shadowColor = '#ffd23a'; ctx.shadowBlur = 12;
    ctx.drawImage(chad.big.stand.r, W / 2 - 30, 94, 60, 90);
    ctx.restore();
    if (blink()) text(touch ? 'TAP JUMP TO START' : 'PRESS ENTER TO START', W / 2, 194, '#fff', 'center', 8);
    text('BEST ' + pad6(best), W / 2, 206, '#a99cc4', 'center', 8);
  } else if (state === 'clear') {
    panel(66, 120);
    text('LEVEL CLEAR', W / 2, 80, '#ffc93c', 'center', 16);
    text('SIGMA STATUS ACHIEVED', W / 2, 106, '#fff', 'center', 8);
    text('SCORE ' + pad6(score) + '   BEST ' + pad6(best), W / 2, 126, '#a99cc4', 'center', 8);
    if (stateT <= 0 && blink()) text(touch ? 'TAP JUMP TO RUN IT BACK' : 'PRESS ENTER TO RUN IT BACK', W / 2, 160, '#fff', 'center', 8);
  }
  if (paused) { panel(100, 40); text('PAUSED', W / 2, 114, '#fff', 'center', 16); }
}

/* ---------- input ---------- */
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', KeyK: 'jump',
  ShiftLeft: 'run', ShiftRight: 'run', KeyX: 'run', KeyJ: 'run', Enter: 'start',
};
addEventListener('keydown', e => {
  if (e.code === 'KeyM') { initAudio(); setMusic(!music.on); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { pauseQueued = true; return; }
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); initAudio(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') paused = true; syncMusic(); }
});
canvas.addEventListener('pointerdown', () => {
  canvas.focus();
  initAudio();
  if (state !== 'play' && state !== 'win' && state !== 'dying') queuedStart = true;
});
document.querySelectorAll('.pad button').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); initAudio(); keys[k] = true; btn.classList.add('on'); try { btn.setPointerCapture(e.pointerId); } catch (_) {} };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('lostpointercapture', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

/* ---------- loop ---------- */
let last = 0, acc = 0;
function loop(t) {
  const dt = Math.min(0.1, (t - last) / 1000 || 0);
  last = t; acc += dt;
  while (acc >= 1 / 60) { update(); acc -= 1 / 60; }
  syncMusic();
  draw();
  requestAnimationFrame(loop);
}
function start(data) {
  loadBest();
  try { setMusic(localStorage.getItem('gigachad-music') !== '0', false); } catch (e) {}
  if (data && data.best > best) best = data.best;
  showBest();
  resetLevel();  window.claude?.hot?.snapshot?.(() => ({ best }));
  requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
